<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Корзина — Магазин</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container py-4" style="max-width:800px">

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
        <strong>Ошибка!</strong>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3">Корзина</h1>
        <div>
            <a href="/items" class="btn btn-outline-secondary me-2">← Витрина</a>
            <a href="/orders" class="btn btn-outline-secondary">📋 Заказы</a>
        </div>
    </div>

    <div th:if="${items.empty}" class="text-center text-muted py-5">
        <p>Корзина пуста</p>
        <a href="/items" class="btn btn-primary">Перейти к товарам</a>
    </div>

    <div th:if="${!items.empty}">
        <table class="table align-middle">
            <thead>
                <tr>
                    <th>Товар</th>
                    <th class="text-center">Цена</th>
                    <th class="text-center">Кол-во</th>
                    <th class="text-center">Сумма</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${items}">
                    <td>
                        <a th:href="@{/items/{id}(id=${item.id})}"
                           th:text="${item.title}" class="text-decoration-none fw-bold"></a>
                    </td>
                    <td class="text-center" th:text="${item.price} + ' ₽'"></td>
                    <td class="text-center">
                        <form method="post" action="/cart/items"
                              class="d-flex align-items-center justify-content-center gap-2">
                            <input type="hidden" name="id" th:value="${item.id}"/>
                            <button type="submit" name="action" value="MINUS"
                                    class="btn btn-sm btn-outline-secondary">−</button>
                            <span th:text="${item.count}"></span>
                            <button type="submit" name="action" value="PLUS"
                                    class="btn btn-sm btn-outline-primary">+</button>
                        </form>
                    </td>
                    <td class="text-center fw-bold" th:text="${item.price * item.count} + ' ₽'"></td>
                    <td>
                        <form method="post" action="/cart/items">
                            <input type="hidden" name="id" th:value="${item.id}"/>
                            <button type="submit" name="action" value="DELETE"
                                    class="btn btn-sm btn-outline-danger">✕</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="d-flex justify-content-between align-items-center mt-3">
            <div class="fs-5 fw-bold" th:text="'Итого: ' + ${total} + ' ₽'"></div>
            <form method="post" action="/buy">
                <button type="submit" class="btn btn-success btn-lg">Оформить заказ</button>
            </form>
        </div>
    </div>

</div>
</body>
</html>
