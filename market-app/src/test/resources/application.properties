spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Короткий TTL для тестов кеша
app.cache.product-ttl=500ms
app.cache.product-list-ttl=500ms

# Payment Service — в тестах не нужен реальный URL (используем моки)
app.payment.service.url=http://localhost:8082

# OAuth2 Client — только чтобы ReactiveClientRegistrationRepository существовал как бин;
# реальный Keycloak в тестах не поднимается (WireMock/mockAuthentication вместо него)
spring.security.oauth2.client.registration.payment-service.provider=keycloak
spring.security.oauth2.client.registration.payment-service.client-id=test-client
spring.security.oauth2.client.registration.payment-service.client-secret=test-secret
spring.security.oauth2.client.registration.payment-service.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:9999/realms/market/protocol/openid-connect/token