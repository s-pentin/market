<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>Магазин</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3">Витрина товаров</h1>
        <div>
            <span sec:authorize="isAuthenticated()" class="me-2" th:text="${#authentication.name}"></span>
            <a sec:authorize="isAuthenticated()" href="/cart/items" class="btn btn-outline-secondary me-2">🛒 Корзина</a>
            <a sec:authorize="isAuthenticated()" href="/orders" class="btn btn-outline-secondary me-2">📋 Заказы</a>
            <form sec:authorize="isAuthenticated()" method="post" action="/logout" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-danger">Выйти</button>
            </form>
            <a sec:authorize="isAnonymous()" href="/login" class="btn btn-primary">Войти</a>
        </div>
    </div>

    <!-- Поиск и сортировка -->
    <form method="get" action="/items" class="row g-2 mb-3">
        <div class="col-md-5">
            <input type="text" name="search" class="form-control"
                   placeholder="Поиск..." th:value="${search}"/>
        </div>
        <input type="hidden" name="pageNumber" value="1"/>
        <input type="hidden" name="pageSize" th:value="${paging.pageSize}"/>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Найти</button>
        </div>
        <div class="col-auto">
            <a th:href="@{/items(search=${search},sort='NO',pageNumber=1,pageSize=${paging.pageSize})}"
               th:class="${sort.name() == 'NO'} ? 'btn btn-secondary' : 'btn btn-outline-secondary'">Без сорт.</a>
        </div>
        <div class="col-auto">
            <a th:href="@{/items(search=${search},sort='ALPHA',pageNumber=1,pageSize=${paging.pageSize})}"
               th:class="${sort.name() == 'ALPHA'} ? 'btn btn-secondary' : 'btn btn-outline-secondary'">По алфавиту</a>
        </div>
        <div class="col-auto">
            <a th:href="@{/items(search=${search},sort='PRICE',pageNumber=1,pageSize=${paging.pageSize})}"
               th:class="${sort.name() == 'PRICE'} ? 'btn btn-secondary' : 'btn btn-outline-secondary'">По цене</a>
        </div>
    </form>

    <!-- Размер страницы -->
    <div class="mb-3 d-flex align-items-center gap-2">
        <span class="text-muted">На странице:</span>
        <a th:href="@{/items(search=${search},sort=${sort},pageNumber=1,pageSize=2)}"
           th:class="${paging.pageSize == 2} ? 'btn btn-sm btn-secondary' : 'btn btn-sm btn-outline-secondary'">2</a>
        <a th:href="@{/items(search=${search},sort=${sort},pageNumber=1,pageSize=5)}"
           th:class="${paging.pageSize == 5} ? 'btn btn-sm btn-secondary' : 'btn btn-sm btn-outline-secondary'">5</a>
        <a th:href="@{/items(search=${search},sort=${sort},pageNumber=1,pageSize=10)}"
           th:class="${paging.pageSize == 10} ? 'btn btn-sm btn-secondary' : 'btn btn-sm btn-outline-secondary'">10</a>
        <a th:href="@{/items(search=${search},sort=${sort},pageNumber=1,pageSize=20)}"
           th:class="${paging.pageSize == 20} ? 'btn btn-sm btn-secondary' : 'btn btn-sm btn-outline-secondary'">20</a>
        <a th:href="@{/items(search=${search},sort=${sort},pageNumber=1,pageSize=50)}"
           th:class="${paging.pageSize == 50} ? 'btn btn-sm btn-secondary' : 'btn btn-sm btn-outline-secondary'">50</a>
        <a th:href="@{/items(search=${search},sort=${sort},pageNumber=1,pageSize=100)}"
           th:class="${paging.pageSize == 100} ? 'btn btn-sm btn-secondary' : 'btn btn-sm btn-outline-secondary'">100</a>
    </div>

    <!-- Сетка товаров -->
    <div class="row row-cols-1 row-cols-md-3 g-3">
        <div class="col" th:each="item : ${items}">
            <div class="card h-100 shadow-sm">
                <img th:if="${item.imgPath != null}" th:src="${item.imgPath}"
                     class="card-img-top" style="height:180px;object-fit:cover;" alt=""/>
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">
                        <a th:href="@{/items/{id}(id=${item.id})}" th:text="${item.title}"
                           class="text-decoration-none text-dark stretched-link"></a>
                    </h5>
                    <p class="card-text text-muted small flex-grow-1" th:text="${item.description}"></p>
                    <div class="mt-2">
                        <div class="fw-bold mb-2" th:text="${item.price} + ' ₽'"></div>
                        <form sec:authorize="isAuthenticated()" method="post" action="/items"
                              class="d-flex align-items-center gap-2" style="position:relative;z-index:1">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="id" th:value="${item.id}"/>
                            <input type="hidden" name="search" th:value="${search}"/>
                            <input type="hidden" name="sort" th:value="${sort}"/>
                            <input type="hidden" name="pageNumber" th:value="${paging.pageNumber}"/>
                            <input type="hidden" name="pageSize" th:value="${paging.pageSize}"/>
                            <button type="submit" name="action" value="MINUS"
                                    class="btn btn-sm btn-outline-secondary">−</button>
                            <span class="fw-bold" th:text="${item.count}"></span>
                            <button type="submit" name="action" value="PLUS"
                                    class="btn btn-sm btn-outline-primary">+</button>
                        </form>
                        <a sec:authorize="isAnonymous()" href="/login"
                           class="btn btn-sm btn-outline-primary mt-1">Войти, чтобы купить</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Пагинация -->
    <div class="d-flex justify-content-center gap-2 mt-4">
        <a th:if="${paging.hasPrevious}"
           th:href="@{/items(search=${search},sort=${sort},pageNumber=${paging.pageNumber - 1},pageSize=${paging.pageSize})}"
           class="btn btn-outline-primary">← Назад</a>
        <span class="btn btn-secondary disabled" th:text="'Страница ' + ${paging.pageNumber}"></span>
        <a th:if="${paging.hasNext}"
           th:href="@{/items(search=${search},sort=${sort},pageNumber=${paging.pageNumber + 1},pageSize=${paging.pageSize})}"
           class="btn btn-outline-primary">Вперёд →</a>
    </div>

</div>
</body>
</html>
