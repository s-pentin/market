<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>Заказы — Магазин</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container py-4" style="max-width:800px">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3">Мои заказы</h1>
        <div>
            <span sec:authorize="isAuthenticated()" class="me-2" th:text="${#authentication.name}"></span>
            <a href="/items" class="btn btn-outline-secondary me-2">← Витрина</a>
            <a href="/cart/items" class="btn btn-outline-secondary me-2">🛒 Корзина</a>
            <form sec:authorize="isAuthenticated()" method="post" action="/logout" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-danger">Выйти</button>
            </form>
        </div>
    </div>

    <div th:if="${orders.empty}" class="text-center text-muted py-5">
        <p>Заказов пока нет</p>
        <a href="/items" class="btn btn-primary">Перейти к товарам</a>
    </div>

    <div th:each="order : ${orders}" class="card mb-3 shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span class="fw-bold" th:text="'Заказ #' + ${order.id}"></span>
            <span class="fs-5 fw-bold text-success" th:text="${order.totalSum} + ' ₽'"></span>
        </div>
        <div class="card-body">
            <table class="table table-sm mb-2">
                <tr th:each="item : ${order.items}">
                    <td th:text="${item.title}"></td>
                    <td class="text-center" th:text="${item.price} + ' ₽'"></td>
                    <td class="text-center" th:text="'× ' + ${item.count}"></td>
                    <td class="text-end fw-bold" th:text="${item.price * item.count} + ' ₽'"></td>
                </tr>
            </table>
            <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary">Открыть заказ</a>
        </div>
    </div>

</div>
</body>
</html>
