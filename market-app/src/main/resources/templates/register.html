<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Регистрация</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container py-5" style="max-width: 400px;">
    <h1 class="h3 mb-4">Регистрация</h1>

    <div th:if="${param.error}" class="alert alert-danger" th:text="${param.error}"></div>

    <form method="post" action="/register" th:object="${registrationRequest}">
        <div class="mb-3">
            <label class="form-label">Логин</label>
            <input type="text" th:field="*{username}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Пароль</label>
            <input type="password" th:field="*{password}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Повторите пароль</label>
            <input type="password" th:field="*{confirmPassword}" class="form-control" required/>
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
    </form>
    <p class="mt-3 text-center">
        Уже есть аккаунт? <a href="/login">Войти</a>
    </p>
</div>
</body>
</html>
