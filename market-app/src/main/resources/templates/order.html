<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="'Заказ #' + ${order.id} + ' — Магазин'">Заказ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container py-4" style="max-width:700px">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <a href="/orders" class="btn btn-outline-secondary">← Все заказы</a>
        <div>
            <a href="/items" class="btn btn-outline-secondary me-2">Витрина</a>
            <a href="/cart/items" class="btn btn-outline-secondary">🛒 Корзина</a>
        </div>
    </div>

    <!-- Уведомление о новом заказе -->
    <div th:if="${newOrder}" class="alert alert-success mb-4">
        <strong>Спасибо за заказ!</strong> Ваш заказ успешно оформлен.
    </div>

    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h2 class="h5 mb-0" th:text="'Заказ #' + ${order.id}"></h2>
            <span class="fs-5 fw-bold text-success" th:text="${order.totalSum} + ' ₽'"></span>
        </div>
        <div class="card-body">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Товар</th>
                        <th class="text-center">Цена</th>
                        <th class="text-center">Кол-во</th>
                        <th class="text-end">Сумма</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${order.items}">
                        <td th:text="${item.title}"></td>
                        <td class="text-center" th:text="${item.price} + ' ₽'"></td>
                        <td class="text-center" th:text="${item.count}"></td>
                        <td class="text-end fw-bold" th:text="${item.price * item.count} + ' ₽'"></td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr class="table-light">
                        <td colspan="3" class="fw-bold">Итого</td>
                        <td class="text-end fw-bold text-success" th:text="${order.totalSum} + ' ₽'"></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

</div>
</body>
</html>
