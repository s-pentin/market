services:
  app:
    build: .
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/market_app
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=secret
    depends_on:
      - postgres
    restart: on-failure

  postgres:
    image: 'postgres:latest'
    environment:
      - POSTGRES_DB=market_app
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=20Maysim_24i
    ports:
      - "5422:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: