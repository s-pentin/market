openapi: 3.0.3
info:
  title: Payment Service API
  version: 1.0.0
paths:
  /api/v1/balance:
    get:
      operationId: getBalance
      tags:
        - Balance
      summary: Получить текущий баланс
      responses:
        '200':
          description: Текущий баланс
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
  /api/v1/payment:
    post:
      operationId: processPayment
      tags:
        - Payment
      summary: Осуществить платёж (списание)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Платёж успешен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '402':
          description: Недостаточно средств
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
components:
  schemas:
    BalanceResponse:
      type: object
      properties:
        balance:
          type: number
        currency:
          type: string
    PaymentRequest:
      type: object
      required:
        - orderId
        - amount
      properties:
        orderId:
          type: integer
          format: int64
        amount:
          type: number
    PaymentResponse:
      type: object
      properties:
        success:
          type: boolean
        newBalance:
          type: number
        message:
          type: string