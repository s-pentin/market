openapi: 3.0.3
info:
  title: Payment Service API
  version: 1.0.0
paths:
  /api/v1/balance/{userId}:
    get:
      operationId: getBalance
      tags:
        - Balance
      summary: Получить текущий баланс пользователя
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Текущий баланс
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
  /api/v1/payment:
    post:
      operationId: processPayment
      tags:
        - Payment
      summary: Осуществить платёж (списание)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Платёж успешен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '402':
          description: Недостаточно средств
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
  /api/v1/payment/by-idempotency-key/{idempotencyKey}:
    get:
      operationId: getPaymentByIdempotencyKey
      tags:
        - Payment
      summary: Найти запись о платеже по idempotency key (используется сверкой незавершённых заказов)
      parameters:
        - name: idempotencyKey
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Запись о платеже найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRecordResponse'
        '404':
          description: Платёж с таким idempotency key ещё не обрабатывался
components:
  schemas:
    BalanceResponse:
      type: object
      properties:
        balance:
          type: number
        currency:
          type: string
    PaymentRequest:
      type: object
      required:
        - userId
        - amount
        - idempotencyKey
      properties:
        userId:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        idempotencyKey:
          type: string
          format: uuid
        amount:
          type: number
    PaymentResponse:
      type: object
      properties:
        success:
          type: boolean
        newBalance:
          type: number
        paymentId:
          type: integer
          format: int64
        message:
          type: string
    PaymentRecordResponse:
      type: object
      properties:
        status:
          type: string
          enum: [SUCCEEDED, FAILED]
        newBalance:
          type: number